app1=192.168.56.4
app2=192.168.56.5
db1=192.168.56.6

# Application servers
[app]
app1
app2

# Database server
[db]
db1

# Group 'multi' with all servers
[multi:children]
app
db

# Variables that will be applied to all servers
[multi:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
